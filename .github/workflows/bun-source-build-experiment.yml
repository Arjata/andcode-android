name: bun-source-build-experiment

# Diagnostic-only experiment: build the pinned Bun candidate source with a
# pinned toolchain and emit the ninja graph (configure-only first milestone).
# This does NOT claim official-ELF correspondence, dependency-license closure,
# modified-library relinking capability or any redistribution approval.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUN_SOURCE_COMMIT: '38afee6c84fcf48c0edb2466aa4b27d287a59c30'
  BUN_SOURCE_SHA256: '64c0d268a6fa9f5e6e5ac40761dacb6b0825b2092f02cd07d772a9018f39e520'
  BUN_TOOLCHAIN_ZIP_SHA256: 'baa6bb36f51d6e58561e02bbea825038a9df454f673d6d776e8bbf86f8c7850e'
  RUST_NIGHTLY: 'nightly-2026-09-15'

jobs:
  configure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    steps:
      - name: Install pinned Bun toolchain
        run: |
          curl -fLSs --retry 3 --connect-timeout 30 \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-aarch64.zip -o /tmp/bun.zip
          echo "$BUN_TOOLCHAIN_ZIP_SHA256  /tmp/bun.zip" | sha256sum -c -
          unzip -q /tmp/bun.zip -d /tmp/buntmp
          sudo mv /tmp/buntmp/bun-linux-aarch64/bun /usr/local/bin/bun
          bun --version

      - name: Install pinned LLVM 23
        run: |
          curl -fLSs --retry 3 https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          /usr/lib/llvm-23/bin/clang --version | head -2

      - name: Install pinned Rust nightly
        run: |
          curl -fLSs --retry 3 https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src
          rustup default "$RUST_NIGHTLY"
          rustc --version

      - name: Install build host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends \
            ninja-build cmake perl python3 ccache pkg-config unzip xz-utils zlib1g-dev

      - name: Fetch pinned Bun candidate source
        run: |
          mkdir -p work && cd work
          curl -fLSs --retry 3 --connect-timeout 30 \
            "https://codeload.github.com/oven-sh/bun/tar.gz/$BUN_SOURCE_COMMIT" -o bun-src.tar.gz
          echo "$BUN_SOURCE_SHA256  bun-src.tar.gz" | sha256sum -c -
          mkdir src && tar -xzf bun-src.tar.gz -C src --strip-components=1
          sha256sum bun-src.tar.gz > source-sha256.txt

      - name: Toolchain identity snapshot
        run: |
          {
            echo "bun=$(bun --version)"
            echo "clang=$(clang --version | head -1)"
            echo "lld=$(ld.lld --version | head -1)"
            echo "rustc=$(rustc --version)"
            echo "ninja=$(ninja --version)"
            echo "cmake=$(cmake --version | head -1)"
            echo "perl=$(perl -v | sed -n 's/.*v\([0-9.]*\).*/\1/p' | head -1)"
            echo "commit=$BUN_SOURCE_COMMIT"
          } | tee work/toolchain-identity.txt

      - name: bun install (frozen lockfile)
        working-directory: work/src
        run: bun install --frozen-lockfile 2>&1 | tail -20

      - name: Configure only (emit ninja graph, fetch vendored deps)
        working-directory: work/src
        run: bun scripts/build.ts --configure-only 2>&1 | tail -60

      - name: Collect configure evidence
        if: always()
        run: |
          cd work
          {
            echo '== toolchain identity =='
            cat toolchain-identity.txt 2>/dev/null || true
            echo '== build dir tree (top) =='
            if [ -d src/build ]; then find src/build -maxdepth 2 | head -40; fi
            echo '== ninja files =='
            ls -la src/build/*.ninja 2>/dev/null || true
            echo '== vendored dependency stamps =='
            find src/vendor -name '.ref' 2>/dev/null | head -40 || true
          } > configure-evidence.txt 2>&1 || true
          cat configure-evidence.txt | head -60

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bun-source-build-experiment
          path: |
            work/toolchain-identity.txt
            work/source-sha256.txt
            work/configure-evidence.txt
            work/src/build/debug/build.ninja
            work/src/build/debug/compile_commands.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bun-source-build-failure
          path: |
            work/configure-evidence.txt
            work/src/*.log
          if-no-files-found: ignore

  build:
    needs: configure
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - name: Install pinned Bun toolchain
        run: |
          curl -fLSs --retry 3 --connect-timeout 30 \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-aarch64.zip -o /tmp/bun.zip
          echo "$BUN_TOOLCHAIN_ZIP_SHA256  /tmp/bun.zip" | sha256sum -c -
          unzip -q /tmp/bun.zip -d /tmp/buntmp
          sudo mv /tmp/buntmp/bun-linux-aarch64/bun /usr/local/bin/bun
          bun --version

      - name: Install pinned LLVM 23
        run: |
          curl -fLSs --retry 3 https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust nightly
        run: |
          curl -fLSs --retry 3 https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src
          rustup default "$RUST_NIGHTLY"

      - name: Install build host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends \
            ninja-build cmake perl python3 ccache pkg-config unzip xz-utils zlib1g-dev

      - name: Fetch pinned Bun candidate source
        run: |
          mkdir -p work && cd work
          curl -fLSs --retry 3 --connect-timeout 30 \
            "https://codeload.github.com/oven-sh/bun/tar.gz/$BUN_SOURCE_COMMIT" -o bun-src.tar.gz
          echo "$BUN_SOURCE_SHA256  bun-src.tar.gz" | sha256sum -c -
          mkdir src && tar -xzf bun-src.tar.gz -C src --strip-components=1
          sha256sum bun-src.tar.gz > source-sha256.txt

      - name: Build debug profile
        id: build
        working-directory: work/src
        run: |
          set -o pipefail
          bun scripts/build.ts -j4 2>&1 | tee build-run.log | tail -40

      - name: Smoke-run the built binary
        working-directory: work/src
        run: |
          BIN=$(ls build/debug/bun-debug)
          file "$BIN" | tee smoke.log
          "$BIN" --version 2>&1 | tee -a smoke.log
          echo 'console.log("andcode-bun-build-smoke-ok", 6*7)' | "$BIN" run - 2>&1 | tee -a smoke.log
          grep -q 'andcode-bun-build-smoke-ok 42' smoke.log

      - name: Build evidence
        if: always()
        run: |
          cd work
          {
            echo '== binary =='
            ls -la src/build/debug/bun-debug 2>/dev/null || true
            sha256sum src/build/debug/bun-debug 2>/dev/null || true
            echo '== objects =='
            find src/build/debug -name '*.o' 2>/dev/null | wc -l
            echo '== smoke =='
            cat src/smoke.log 2>/dev/null || true
            echo '== last build log lines =='
            tail -30 src/build-run.log 2>/dev/null || true
          } > build-evidence.txt 2>&1 || true
          tail -50 build-evidence.txt || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bun-source-build-experiment
          path: |
            work/source-sha256.txt
            work/build-evidence.txt
            work/src/smoke.log
            work/src/build/debug/bun-debug
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bun-source-build-failure
          path: |
            work/build-evidence.txt
            work/src/build-run.log
          if-no-files-found: ignore

  build-release:
    needs: configure
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    env:
      GLIBC_SYSROOT_IMAGE: 'sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214'
      GCC13_TARBALL_SHA256: 'be19db90d94c52c6061280bbadcaad9b09db1e9f2e77a12f8c18c5425d2eb056'
    steps:
      - name: Install pinned Bun toolchain
        run: |
          curl -fLSs --retry 3 --connect-timeout 30 \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-aarch64.zip -o /tmp/bun.zip
          echo "$BUN_TOOLCHAIN_ZIP_SHA256  /tmp/bun.zip" | sha256sum -c -
          unzip -q /tmp/bun.zip -d /tmp/buntmp
          sudo mv /tmp/buntmp/bun-linux-aarch64/bun /usr/local/bin/bun

      - name: Install pinned LLVM 23
        run: |
          curl -fLSs --retry 3 https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust nightly
        run: |
          curl -fLSs --retry 3 https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src
          rustup default "$RUST_NIGHTLY"

      - name: Install build host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends \
            ninja-build cmake perl python3 ccache pkg-config unzip xz-utils zlib1g-dev \
            skopeo jq

      - name: Provision pinned focal glibc sysroot
        run: |
          set -eu
          SYSROOT="$RUNNER_TEMP/glibc-sysroot-aarch64"
          mkdir -p "$SYSROOT" /tmp/sysroot-img
          skopeo copy --override-arch arm64 \
            "docker://docker.io/library/ubuntu@$GLIBC_SYSROOT_IMAGE" dir:/tmp/sysroot-img
          for layer in $(jq -r '.layers[].digest' /tmp/sysroot-img/manifest.json | sed 's/^sha256://'); do
            tar -xzf "/tmp/sysroot-img/$layer" -C "$SYSROOT" || true
          done
          download_deb() {
            curl -fLSs --retry 3 --connect-timeout 30 \
              "https://ports.ubuntu.com/ubuntu-ports/pool/main/$1" -o /tmp/deb.deb
            echo "$2  /tmp/deb.deb" | sha256sum -c -
            dpkg-deb -x /tmp/deb.deb "$SYSROOT"
          }
          download_deb i/icu/libicu70_70.1-2_arm64.deb ac68372cf4a976e6a206858fd9b28c68e49d37d650b9b8653270038a6e7bc174
          download_deb g/glibc/libc6_2.31-0ubuntu9.18_arm64.deb 4ff60d84ad78f3aa598297dc6966549fa6489f57599f197562ad91547f388da0
          download_deb g/glibc/libc6-dev_2.31-0ubuntu9.18_arm64.deb a690787a4ed5ad1bb9ce6aebe0bef3300e483e7ed97d11a6af3cdb107e642292
          download_deb l/linux/linux-libc-dev_5.4.0-216.236_arm64.deb 9f487e7f3a9fff7f42f67172e139fd23c11b30e9b70bf6ae5a2e90b099547990
          download_deb libx/libxcrypt/libcrypt1_4.4.10-10ubuntu4_arm64.deb 89907b6c1b613c430a53ef10909934b9ce5854a396cd173360495f6f8e5e7ea4
          download_deb libx/libxcrypt/libcrypt-dev_4.4.10-10ubuntu4_arm64.deb 3cbd65247c73ec78e15e9364d3f15643591fe25849382251c77a49204f083e68
          curl -fLSs --retry 3 --connect-timeout 30 \
            https://github.com/oven-sh/WebKit/releases/download/gcc-13-focal-debs/gcc-13-focal-arm64.tar.gz \
            -o /tmp/gcc13.tar.gz
          echo "$GCC13_TARBALL_SHA256  /tmp/gcc13.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gcc13 && tar -xzf /tmp/gcc13.tar.gz -C /tmp/gcc13
          for deb in /tmp/gcc13/*.deb; do dpkg-deb -x "$deb" "$SYSROOT"; done
          while IFS= read -r link; do
            target=$(readlink "$link")
            case "$target" in
              /*) ln -sfn "$SYSROOT$target" "$link" ;;
            esac
          done < <(find "$SYSROOT" -type l)
          if [ ! -e "$SYSROOT/lib/aarch64-linux-gnu/libc.so.6" ]; then
            mkdir -p "$SYSROOT/lib"
            ln -sfn ../usr/lib/aarch64-linux-gnu "$SYSROOT/lib/aarch64-linux-gnu"
          fi
          ls "$SYSROOT/usr/lib/aarch64-linux-gnu/libc.so.6" >/dev/null
          echo "SYSROOT=$SYSROOT" >> "$GITHUB_ENV"

      - name: Fetch pinned Bun candidate source
        run: |
          mkdir -p work && cd work
          curl -fLSs --retry 3 --connect-timeout 30 \
            "https://codeload.github.com/oven-sh/bun/tar.gz/$BUN_SOURCE_COMMIT" -o bun-src.tar.gz
          echo "$BUN_SOURCE_SHA256  bun-src.tar.gz" | sha256sum -c -
          mkdir src && tar -xzf bun-src.tar.gz -C src --strip-components=1
          sha256sum bun-src.tar.gz > source-sha256.txt

      - name: Build release profile against pinned sysroot
        working-directory: work/src
        run: |
          set -o pipefail
          LINUX_GLIBC_SYSROOT="$SYSROOT" bun scripts/build.ts --profile=release -j4 \
            2>&1 | tee build-run.log | tail -40

      - name: Smoke-run the release binary
        working-directory: work/src
        run: |
          BIN=$(ls build/release/bun-release)
          file "$BIN" | tee smoke.log
          "$BIN" --version 2>&1 | tee -a smoke.log
          echo 'console.log("andcode-bun-release-smoke-ok", 6*7)' | "$BIN" run - 2>&1 | tee -a smoke.log
          grep -q 'andcode-bun-release-smoke-ok 42' smoke.log

      - name: Release evidence
        if: always()
        run: |
          cd work
          {
            echo '== binary =='
            ls -la src/build/release/bun-release 2>/dev/null || true
            sha256sum src/build/release/bun-release 2>/dev/null || true
            echo '== objects =='
            find src/build/release -name '*.o' 2>/dev/null | wc -l
            echo '== smoke =='
            cat src/smoke.log 2>/dev/null || true
            echo '== last build log lines =='
            tail -30 src/build-run.log 2>/dev/null || true
          } > release-evidence.txt 2>&1 || true
          tail -50 release-evidence.txt || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bun-release-build-experiment
          path: |
            work/source-sha256.txt
            work/release-evidence.txt
            work/src/smoke.log
            work/src/build/release/bun-release
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bun-release-build-failure
          path: |
            work/release-evidence.txt
            work/src/build-run.log
          if-no-files-found: ignore
