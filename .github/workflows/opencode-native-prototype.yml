name: opencode-native-prototype

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: dc2ffcf8bf26f9e669b6aa22b95f50e12be15e06
          path: work/upstream
          persist-credentials: false
      - name: Fixed Bun build tool (not a new shipped runtime dependency)
        run: |
          mkdir -p work/bun
          if ! curl -fLSs --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 180 https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-aarch64.zip -o work/bun.zip; then
            # Same fixed public release asset, different GitHub download route;
            # never accept metadata/HTML or a different tool without the hash.
            curl -fLSs --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 180 -H 'Accept: application/octet-stream' https://api.github.com/repos/oven-sh/bun/releases/assets/665259460 -o work/bun.zip
          fi
          echo 'baa6bb36f51d6e58561e02bbea825038a9df454f673d6d776e8bbf86f8c7850e  work/bun.zip' | sha256sum -c -
          unzip -q work/bun.zip -d work/bun
          echo "$GITHUB_WORKSPACE/work/bun/bun-linux-aarch64" >> "$GITHUB_PATH"
      - name: Native import plugin regression
        run: |
          bun test scripts/opencode-native-imports.test.ts
          python3 scripts/audit-opencode-native.test.py
          python3 scripts/collect-opencode-native-licenses.test.py
          python3 scripts/collect-opencode-native-sources.test.py
          python3 scripts/collect-opencode-native-runtime.test.py
          python3 scripts/collect-opencode-native-rust.test.py
          python3 scripts/build-opencode-native-pty.test.py
          python3 scripts/build-opencode-native-watcher.test.py
          python3 scripts/build-opencode-native-fff.test.py
          python3 scripts/build-opencode-native-opentui.test.py
          python3 scripts/manifest-opencode-native.test.py
      - name: Optional CA real TLS, bundled roots and hostname rejection
        timeout-minutes: 3
        run: python3 scripts/custom-ca-tls.test.py
      - name: Frozen upstream dependencies and explicit import paths
        run: |
          cd work/upstream
          bun install --frozen-lockfile
          cd ../..
          python3 scripts/prepare-opencode-native-build.py work/upstream
      - name: Fixed-source bun-pty rebuild (diagnostic only)
        run: |
          mkdir -p work/native-prototype
          python3 scripts/build-opencode-native-pty.py work/upstream work/native-prototype
      - name: Fixed-source watcher rebuild and real file event
        run: |
          python3 scripts/build-opencode-native-watcher.py work/upstream work/native-prototype
      - name: Fixed Zig build tool and fff source rebuild (diagnostic only)
        run: |
          mkdir -p work/zig
          curl -fLSs --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 180 https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz -o work/zig/zig.tar.xz
          echo 'ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17  work/zig/zig.tar.xz' | sha256sum -c -
          tar -xJf work/zig/zig.tar.xz -C work/zig
          export PATH="$GITHUB_WORKSPACE/work/zig/zig-aarch64-linux-0.16.0:$PATH"
          python3 scripts/build-opencode-native-fff.py work/upstream work/native-prototype
      - name: Fixed Zig 0.17 and OpenTUI FFmpeg source rebuild (diagnostic only)
        run: |
          mkdir -p work/zig-opentui
          curl -fLSs --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 180 https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz -o work/zig-opentui/zig.tar.xz
          echo '9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8  work/zig-opentui/zig.tar.xz' | sha256sum -c -
          tar -xJf work/zig-opentui/zig.tar.xz -C work/zig-opentui
          export PATH="$GITHUB_WORKSPACE/work/zig-opentui/zig-aarch64-linux-0.17.0:$PATH"
          python3 scripts/build-opencode-native-opentui.py work/upstream work/native-prototype
      - name: Build experimental source V2 including Web assets
        env:
          OPENCODE_CHANNEL: beta
          OPENCODE_VERSION: 2.2.6
          OPENCODE_TARGET: linux-arm64
          ANDCODE_NATIVE_STAGE: ${{ github.workspace }}/work/native-prototype
        run: |
          cd work/upstream
          bun run packages/cli/script/build.ts --single --skip-install
      - name: Static native closure gate
        run: |
          cp work/upstream/packages/cli/dist/cli-linux-arm64/bin/opencode work/native-prototype/
          python3 scripts/audit-opencode-native.py work/native-prototype
          bash baseline/check-compat.sh --page-align work/native-prototype
      - name: Explicit Ubuntu 24.04 runtime closure (not runner libraries)
        run: |
          CID=$(docker create --platform linux/arm64 ubuntu:24.04 sleep infinity)
          trap 'docker rm -f "$CID" >/dev/null' EXIT
          docker start "$CID" >/dev/null
          docker exec "$CID" sh -ec 'apt-get update -qq; apt-get install -y -qq --no-install-recommends libstdc++6 libgcc-s1'
          IMAGE=$(docker inspect --format '{{.Image}}' "$CID")
          docker export "$CID" -o work/runtime-rootfs.tar
          mkdir -p work/runtime-rootfs
          tar -xf work/runtime-rootfs.tar -C work/runtime-rootfs
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          # Self-spawning TUI must retain the CLI in /proc/self/exe. An explicit
          # `ld.so CLI` invocation is not equivalent; point PT_INTERP at staged ld.
          EXE="$GITHUB_WORKSPACE/work/upstream/packages/cli/dist/cli-linux-arm64/bin/opencode"
          patchelf --set-interpreter "$GITHUB_WORKSPACE/work/native-prototype/runtime/ld-linux-aarch64.so.1" "$EXE"
          cp "$EXE" work/native-prototype/opencode
          python3 scripts/audit-opencode-native.py work/native-prototype
          python3 scripts/collect-opencode-native-runtime.py work/runtime-rootfs work/native-prototype "$IMAGE"
          bash baseline/check-compat.sh --page-align work/native-prototype
      - name: Execution, shell, PTYs and empty extraction directory gate
        run: |
          set -euo pipefail
          mkdir -p work/probe-home work/probe-tmp
          export ANDCODE_EXE_DIR="$GITHUB_WORKSPACE/work/native-prototype/native"
          export ANDCODE_LOADER="$GITHUB_WORKSPACE/work/native-prototype/runtime/ld-linux-aarch64.so.1"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/work/native-prototype/runtime"
          export HOME="$GITHUB_WORKSPACE/work/probe-home" BUN_TMPDIR="$GITHUB_WORKSPACE/work/probe-tmp"
          # Exercise the final content-addressed copy with the collected runtime,
          # not only the build output against runner libraries.
          python3 - <<'PY'
          import os, shutil, subprocess
          from pathlib import Path
          stage = Path('work/native-prototype').resolve()
          rows = [line.split('\t') for line in (stage / 'oc2-native.tsv').read_text().splitlines()]
          watcher = [row for row in rows if '/@parcel/watcher-linux-arm64-glibc/' in row[3]]
          assert len(watcher) == 1
          probe = stage / 'native-watcher-build/probe.mjs'
          result = subprocess.run([os.environ['ANDCODE_LOADER'], '--library-path', os.environ['LD_LIBRARY_PATH'],
                                   '--inhibit-cache', shutil.which('bun'), str(probe), str(stage / 'native' / watcher[0][0]),
                                   str(stage / 'native-watcher-build')],
                                  capture_output=True, text=True, timeout=30)
          (stage / 'native-watcher-build/staged-event.log').write_text(result.stdout + result.stderr)
          print(result.stdout + result.stderr)
          result.check_returncode()
          assert 'ANDCODE_SOURCE_WATCHER_EVENT_OK' in result.stdout
          fff = [row for row in rows if '/@ff-labs/fff-bin-linux-arm64-gnu/' in row[3]]
          assert len(fff) == 1
          result = subprocess.run([os.environ['ANDCODE_LOADER'], '--library-path', os.environ['LD_LIBRARY_PATH'],
                                   '--inhibit-cache', shutil.which('bun'), str(stage / 'native-fff-build/probe.mjs'),
                                   str(stage / 'native' / fff[0][0]), str(stage / 'native-fff-build')],
                                  capture_output=True, text=True, timeout=40)
          (stage / 'native-fff-build/staged-search.log').write_text(result.stdout + result.stderr)
          print(result.stdout + result.stderr)
          result.check_returncode()
          assert 'ANDCODE_SOURCE_FFF_SEARCH_GLOB_OK' in result.stdout
          PY
          export OPENCODE_PTY_BIN="$(find "$GITHUB_WORKSPACE/work/upstream/node_modules/.bun" -path '*/@opencode/pty-linux-arm64-gnu/bin/opencode-pty' -type f -print -quit)"
          test -n "$OPENCODE_PTY_BIN"
          EXE="$GITHUB_WORKSPACE/work/upstream/packages/cli/dist/cli-linux-arm64/bin/opencode"
          "$ANDCODE_LOADER" --library-path "$LD_LIBRARY_PATH" --inhibit-cache "$EXE" --version
          "$EXE" serve --hostname 127.0.0.1 --port 4096 > work/prototype-serve.log 2>&1 &
          pid=$!
          export ANDCODE_SERVE_PID="$pid"
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fSs http://127.0.0.1:4096/ -o work/web-index.html; then ready=1; break; fi
            kill -0 "$pid"
            sleep 1
          done
          test "$ready" = 1
          python3 scripts/probe-opencode-native.py
          python3 scripts/probe-opencode-native-tui.py "$EXE"
          python3 - <<'PY'
          from pathlib import Path
          for root in ['work/probe-home', 'work/probe-tmp']:
              for f in Path(root).rglob('*'):
                  if f.is_file():
                      with f.open('rb') as src:
                          assert src.read(4) != b'\x7fELF', f'Runtime extracted ELF: {f}'
          print('Serve/shell/PTY/TUI ready; no runtime ELF in isolated HOME/BUN_TMPDIR (not Android acceptance)')
          PY
      - name: Save prototype provenance and upstream license
        run: |
          python3 scripts/collect-opencode-native-licenses.py work/upstream work/native-prototype
          python3 scripts/collect-opencode-native-sources.py work/native-prototype
          python3 scripts/collect-opencode-native-rust.py work/native-prototype
          cp work/upstream/LICENSE work/native-prototype/upstream-LICENSE
          cp work/upstream/bun.lock work/native-prototype/upstream-bun.lock
          cp work/upstream/packages/cli/dist/cli-linux-arm64/bin/opencode work/native-prototype/
          git -C work/upstream rev-parse HEAD > work/native-prototype/upstream-commit.txt
          echo 'DIAGNOSTIC ONLY: no compatibility, transitive license or Android acceptance approval.' > work/native-prototype/README.txt
          python3 scripts/manifest-opencode-native.py work/native-prototype > work/prototype.sha256
      - name: Preserve failed fff build logs (not an accepted diagnostic package)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-fff-build-logs
          if-no-files-found: ignore
          path: |
            work/native-prototype/native-fff-build/sort-test.log
            work/native-prototype/native-fff-build/command-*.log
      - name: Preserve failed OpenTUI build logs (not an accepted diagnostic package)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-opentui-build-logs
          if-no-files-found: ignore
          path: |
            work/native-prototype/native-opentui-build/command-*.log
            work/native-prototype/native-opentui-build/crc-probe.c
            work/native-prototype/native-opentui-build/crc-probe.log
            work/native-prototype/native-opentui-build/ffmpeg-config/
            work/native-prototype/native-opentui-build/ffmpeg-notice-candidates.json
            work/native-prototype/native-opentui-build/link-replay/*.log
            work/native-prototype/native-opentui-build/link-replay/link.map
            work/native-prototype/native-opentui-build/link-replay/archive-extraction.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-native-prototype-diagnostic
          # Only the isolated stage of fixed upstream sources/evidence is uploaded.
          # Preserve dotfiles so prototype.sha256 remains a complete byte manifest.
          include-hidden-files: true
          path: |
            work/native-prototype/
            work/prototype.sha256
