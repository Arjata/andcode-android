name: andcode-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk-intermediate:
    needs: build-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: andcode-tier-p-native
          path: work/native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install matching Android build tools
        run: sdkmanager 'platforms;android-37' 'build-tools;36.1.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build and lint intermediate APK (not a complete self-contained product)
        run: gradle -p app -PandcodeNativeDir="$GITHUB_WORKSPACE/work/native" assembleDebug lintDebug --no-daemon
      - name: Prepare actual CI manifest as links and data only
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/runtime-tests" \
            app/app/src/main/java/dev/andcode/app/RuntimePayload.java app/tests/RuntimePayloadTest.java
          java -cp "$RUNNER_TEMP/runtime-tests" dev.andcode.app.RuntimePayloadTest \
            "$GITHUB_WORKSPACE/work/native/arm64-v8a" "$GITHUB_WORKSPACE/work/native/assets/andcode-runtime"
      - name: Verify APK native payload bytes and packaged data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          native = Path('work/native')
          with zipfile.ZipFile('app/app/build/outputs/apk/debug/app-debug.apk') as apk:
              # Android ZIP writers use raw UTF-8 names but may omit bit 11.
              names = {(i.filename if i.flag_bits & 0x800 else i.filename.encode('cp437').decode('utf-8')): i
                       for i in apk.infolist()}
              for f in (native / 'arm64-v8a').glob('libandcode-*.so'):
                  assert apk.read(names['lib/arm64-v8a/' + f.name]) == f.read_bytes(), f.name
              for f in (native / 'assets').rglob('*'):
                  if f.is_file():
                      assert apk.read(names['assets/' + f.relative_to(native / 'assets').as_posix()]) == f.read_bytes(), f
          print('APK preserves native ELF/scripts and data bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: andcode-apk-intermediate
          path: |
            app/app/build/outputs/apk/debug/*.apk
            app/app/build/reports/lint-results-debug.*

  app-data-tests:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Launcher argv memory safety and argument preservation
        run: python3 scripts/launcher.test.py
      - name: PTY entry compiler checks
        run: cc -Wall -Wextra -Werror -fsyntax-only bundle/launcher/pty-launcher.c
      - name: 项目 ZIP 安全与导出往返测试(平台 JDK,无第三方测试依赖)
        run: |
          mkdir -p "$RUNNER_TEMP/archive-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/archive-tests" \
            app/app/src/main/java/dev/andcode/app/ProjectArchive.java app/tests/ProjectArchiveTest.java
          java -cp "$RUNNER_TEMP/archive-tests" dev.andcode.app.ProjectArchiveTest
      - name: Web terminal IME regression tests
        run: node --test app/tests/andcode-terminal-ime.test.mjs
      - name: Native link farm and data safety regression
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/runtime-tests" \
            app/app/src/main/java/dev/andcode/app/RuntimePayload.java app/tests/RuntimePayloadTest.java
          java -cp "$RUNNER_TEMP/runtime-tests" dev.andcode.app.RuntimePayloadTest

  build-bundle:
    # 与基线发行版同构(DESIGN §3.2 入口 3),无需 QEMU
    runs-on: ubuntu-24.04-arm
    env:
      MAX_GLIBC: "2.39"
    steps:
      - uses: actions/checkout@v4

      - name: 仓库卫生(LFS 规则,docs/LFS.md §4)
        run: bash scripts/lfs-check.sh "$GITHUB_WORKSPACE"

      - name: 打包与 seccomp 脚本语法
        run: |
          bash -n bundle/pack-bundle.sh
          bash -n bundle/pack-apk-libs.sh
          bash -n scripts/patch-seccomp.sh

      - name: 生成基线 rootfs(docker export ubuntu:24.04,arm64 原生)
        run: |
          docker pull --platform linux/arm64 ubuntu:24.04
          CID=$(docker create --platform linux/arm64 ubuntu:24.04 sleep infinity)
          docker start $CID && sleep 1
          # 基线必须含 ca-certificates(git/https)与 zstd;纯净镜像没有
          docker exec $CID bash -c "apt-get update -qq && apt-get install -y -qq ca-certificates zstd bash libtinfo6 >/dev/null"
          mkdir -p work
          docker export $CID -o work/rootfs.tar
          docker rm -f $CID
          mkdir -p work/rootfs
          tar -xf work/rootfs.tar -C work/rootfs
          test -s work/rootfs/etc/ssl/certs/ca-certificates.crt

      - name: 收录基线 Bash 与许可证(不依赖第三方宿主)
        run: |
          mkdir -p work/stage/bin work/stage/etc/third-party
          cp work/rootfs/usr/bin/bash work/stage/bin/bash
          cp work/rootfs/usr/share/doc/bash/copyright work/stage/etc/third-party/bash-copyright
          cp -L work/rootfs/usr/share/doc/libtinfo6/copyright work/stage/etc/third-party/ncurses-copyright
          cp work/rootfs/usr/share/common-licenses/GPL-3 work/stage/etc/third-party/gpl-3

      - name: 获取 opencode 官方 linux-arm64 产物(P0 冒烟对象)
        run: |
          # 资产名经 2026-11-06 API 实测核实:v1.19.5 起为 opencode-linux-arm64.tar.gz(glibc)
          ASSET=$(curl -fsSL https://api.github.com/repos/sst/opencode/releases/latest \
            | jq -r '.assets[] | select(.name == "opencode-linux-arm64.tar.gz") | .browser_download_url')
          [ -n "$ASSET" ] || { curl -fsSL https://api.github.com/repos/sst/opencode/releases/latest \
            | jq -r '.assets[].name'; exit 1; }
          echo "asset: $ASSET"
          curl -fsSL "$ASSET" -o work/opencode-asset
          mkdir -p work/stage/bin work/stage-root
          tar -xzf work/opencode-asset -C work/stage-root
          BIN=$(find work/stage-root -type f -name 'opencode*' | while read -r f; do
                 file -b "$f" | grep -q 'ELF 64-bit.*ARM aarch64' && echo "$f" && break
               done)
          [ -n "$BIN" ] || { find work/stage-root -type f | head -50; exit 1; }
          cp "$BIN" work/stage/bin/opencode
          echo "opencode ELF: $BIN"

      - name: 获取静态 busybox(Alpine busybox-static 包,musl 静态;来源记入 manifest)
        run: |
          # 注意: alpine:3.19 的 /bin/busybox 是动态链接 musl;busybox-static 包提供 /bin/busybox.static
          docker run --rm --platform linux/arm64 -v "$PWD/work:/out" alpine:3.19 \
            sh -c "apk update -q && apk add -q busybox-static && cp /bin/busybox.static /out/busybox-arm64"
          cp work/busybox-arm64 work/stage/bin/busybox
          file -b work/stage/bin/busybox | grep -q 'statically linked\|static-pie' \
            || { file -b work/stage/bin/busybox; echo "busybox 非静态"; exit 1; }
          echo "busybox: $(work/stage/bin/busybox | head -n1)"

      - name: Stage pinned V2 and PTY daemon (TLS and SHA-256 required)
        run: |
          curl -fLSs https://github.com/anomalyco/opencode/releases/download/v2.2.6/opencode-linux-arm64.tar.gz -o work/oc2.tar.gz
          echo 'f2d27600c367e45057d6a16f6a5c2aa8d77b41a9b10d4bc3d849c2f88870e944  work/oc2.tar.gz' | sha256sum -c -
          mkdir -p work/oc2 work/pty work/stage/usr/lib/opencode-pty
          tar -xzf work/oc2.tar.gz -C work/oc2
          cp work/oc2/opencode work/stage/bin/oc2
          curl -fLSs https://github.com/anomalyco/opencode/releases/download/process-daemon-v0.4.0/opencode-pty-0.4.0-aarch64-unknown-linux-gnu.tar.gz -o work/pty.tar.gz
          echo '52c421672ad6fadcb87cc2e918ad55622a7da588468d8029abd031d5cc752e57  work/pty.tar.gz' | sha256sum -c -
          tar -xzf work/pty.tar.gz -C work/pty
          cp work/pty/opencode-pty work/stage/usr/lib/opencode-pty/opencode-pty
          curl -fLSs https://raw.githubusercontent.com/anomalyco/opencode/v2.2.6/LICENSE -o work/stage/etc/third-party/opencode-v2-license
          curl -fLSs https://raw.githubusercontent.com/anomalyco/opencode/5e6ee370634842e0efa99ad103c4d767581b47f0/LICENSE -o work/stage/etc/third-party/opencode-pty-license

      - name: 获取 git 前缀(容器内复制,保 GIT_EXEC_PATH 结构)
        run: |
          CID=$(docker create --platform linux/arm64 ubuntu:24.04 sleep infinity)
          docker start $CID && sleep 1
          docker exec $CID bash -c "apt-get update -qq && apt-get install -y -qq git >/dev/null"
          # 只取 git 家族二进制(/usr/bin/git 与 git-* 助手);/usr/bin 全量拷贝会带入 apt/dpkg
          docker exec $CID bash -c "mkdir -p /tmp/gitbin && cp -a /usr/bin/git /usr/bin/git-* /tmp/gitbin/ 2>/dev/null || true"
          mkdir -p work/stage/usr/bin work/stage/usr/libexec work/git-libs
          docker cp $CID:/tmp/gitbin/. work/stage/usr/bin/
          docker cp $CID:/usr/libexec/git-core work/stage/usr/libexec/git-core 2>/dev/null \
            || { docker exec $CID mkdir -p /usr/libexec && docker cp $CID:/usr/lib/git-core work/stage/usr/libexec/git-core; }
          # git 的私有依赖(libcurl-gnutls/libexpat 等)在 git 容器,rootfs 里没有;
          # 作为解析源交给 pack-bundle(--extralib),不进 bundle 树
          docker cp $CID:/usr/lib/aarch64-linux-gnu work/git-libs/aarch64-linux-gnu
          docker rm -f $CID

      - name: 获取 proot(Termux bionic 构建,Tier A/M /etc 重定向正解)
        run: |
          mkdir -p work/proot work/proot-x
          curl -sL -o work/proot/proot.deb "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107.102_aarch64.deb"
          curl -sL -o work/proot/talloc.deb "https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.5.0_aarch64.deb"
          curl -sL -o work/proot/shmem.deb "https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/libandroid-shmem_0.7_aarch64.deb"
          for d in proot talloc shmem; do
            mkdir -p work/proot-x/$d
            ( cd work/proot-x/$d && ar x ../../proot/$d.deb )
            tar -xJf work/proot-x/$d/data.tar.xz -C work/proot-x/$d
          done
          P=work/proot-x/proot/data/data/com.termux/files/usr
          T=work/proot-x/talloc/data/data/com.termux/files/usr
          S=work/proot-x/shmem/data/data/com.termux/files/usr
          mkdir -p work/proot-dir/lib work/proot-dir/libexec/proot
          cp $P/bin/proot work/proot-dir/proot
          cp $P/libexec/proot/loader work/proot-dir/libexec/proot/loader
          cp $T/lib/libtalloc.so.2.5.0 work/proot-dir/lib/libtalloc.so.2
          cp $S/lib/libandroid-shmem.so work/proot-dir/lib/
          chmod 0755 work/proot-dir/proot work/proot-dir/libexec/proot/loader

      - name: 组装 bundle
        run: |
          sudo apt-get install -y -qq musl-tools >/dev/null 2>&1 || true
          musl-gcc -static -O2 -Wl,-z,max-page-size=16384 -o work/andcode-launcher bundle/launcher/launcher.c
          musl-gcc -static -O2 -Wl,-z,max-page-size=16384 -o work/stage/bin/opencode-pty bundle/launcher/pty-launcher.c
          file -b work/andcode-launcher | grep -q 'statically linked\|static-pie' || { echo "launcher 非静态"; exit 1; }
          mkdir -p dist
          bash bundle/pack-bundle.sh \
            --rootfs work/rootfs \
            --stage work/stage \
            --extralib work/git-libs/aarch64-linux-gnu \
            --proot work/proot-dir \
            --launcher work/andcode-launcher \
            --out dist/andcode-bundle-arm64-v0.1.1.tar.gz \
            --shebang /bin/sh \
            --name v0.1.1

      - name: 诊断 git 助手链路(定位 capabilities not found)
        run: |
          mkdir -p work/dbg && tar -xzf dist/andcode-bundle-arm64-v0.1.1.tar.gz -C work/dbg --strip-components=1
          docker run --rm --platform linux/arm64 -v "$PWD/work/dbg:/opt" -v "$PWD/scripts:/scripts:ro" \
            -e ANDCODE_ROOT=/opt -e ANDCODE_TIER=a ubuntu:24.04 bash /scripts/ci-git-debug.sh /opt

      - name: 兼容性审计(DESIGN §3.3)
        run: |
          mkdir -p work/audit && tar -xzf dist/andcode-bundle-arm64-v0.1.1.tar.gz -C work/audit
          bash baseline/check-compat.sh --page-align \
            work/audit/andcode/bin work/audit/andcode/usr/bin work/audit/andcode/lib

      - name: 命名规范门禁(NAMING §8)
        run: bash scripts/naming-lint.sh --bundle-dir work/audit/andcode

      - name: Manifest kind, license and Tier P identity regression
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows = [r for r in csv.reader(Path('work/audit/andcode/manifest').open(), delimiter='\t') if r and not r[0].startswith('#')]
          names = [r[1] for r in rows if r[1] != '-']
          assert len(names) == len(set(names)), 'duplicate physical filename would overwrite payload'
          manifest = {r[0]: r for r in rows}
          expected = {
              'lib/ld-linux-aarch64.so.1': ('libandcode-ld-linux.so', 'glibc-lib', 'LGPL-2.1'),
              'lib/libc.so.6': ('libandcode-libc.so', 'glibc-lib', 'LGPL-2.1'),
              'bin/git': ('libandcode-cmd-git.so', 'launcher', 'AGPL-3.0-only'),
              'usr/libexec/git-core/git-remote-https': ('libandcode-git-core-git-remote-https.so', 'launcher', 'AGPL-3.0-only'),
          }
          for path, fields in expected.items():
              assert tuple(manifest[path][1:4]) == fields, (path, manifest[path])
          assert manifest['usr/bin/git.bin'][3] == 'GPL-2.0-or-later'
          assert manifest['usr/lib/proot/proot'][3] == 'GPL-2.0'
          assert manifest['usr/lib/proot/libtalloc.so.2'][3] == 'LGPL-3.0-or-later'
          print('Manifest kind/license/physical identity OK')
          PY

      - name: Bash 载荷与闭包检查
        run: |
          B=work/audit/andcode
          test -s "$B/bin/bash.bin"
          test -s "$B/lib/libtinfo.so.6"
          test -s "$B/etc/third-party/bash-copyright"
          test -s "$B/etc/third-party/ncurses-copyright"
          test -s "$B/etc/third-party/gpl-3"
          grep -F 'GPL-3.0-or-later' "$B/manifest" | grep -F 'bin/bash.bin'
          "$B/lib/ld-linux-aarch64.so.1" --library-path "$B/lib" --inhibit-cache \
            "$B/bin/bash.bin" --noprofile --norc -c 'test -n "$BASH_VERSION"; printf "Bash %s\n" "$BASH_VERSION"'

      - name: 生成 THIRD-PARTY-NOTICES(REUSE §4)
        run: bash scripts/gen-notices.sh work/audit/andcode/manifest > dist/THIRD-PARTY-NOTICES.md && head -n 12 dist/THIRD-PARTY-NOTICES.md

      - name: 冒烟自测(容器内 wrapper 链路,Tier A 等价)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/dist" -v "$PWD/scripts:/scripts:ro" \
            -e ANDCODE_ROOT=/opt -e ANDCODE_TIER=a \
            ubuntu:24.04 bash -c '
              mkdir -p /opt && tar -xzf /dist/andcode-bundle-arm64-v0.1.1.tar.gz -C /opt --strip-components=1
              sh /scripts/smoke-test.sh
            '

      - name: Tier P 物理化路线甲(patchelf 重写,NAMING §6.3)
        run: |
          command -v patchelf >/dev/null || sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          # Keep the canonical Linux artifact unmodified. Fail closed on a new
          # glibc baseline rather than silently distribute unpatched Android ELF.
          mkdir -p work/android-bundle
          cp -a work/audit/andcode work/android-bundle/andcode
          bash scripts/patch-seccomp.sh work/android-bundle/andcode
          sha256sum work/android-bundle/andcode/lib/ld-linux-aarch64.so.1 \
            work/android-bundle/andcode/lib/libc.so.6 > work/seccomp-after.sha256
          bash scripts/patch-seccomp.sh work/android-bundle/andcode
          sha256sum -c work/seccomp-after.sha256
          bash scripts/naming-lint.sh --bundle-dir work/android-bundle/andcode
          bash baseline/check-compat.sh --page-align work/android-bundle/andcode/lib
          tar -czf dist/andcode-bundle-android-arm64-v0.1.1.tar.gz -C work/android-bundle andcode
          sha256sum dist/andcode-bundle-android-arm64-v0.1.1.tar.gz \
            > dist/andcode-bundle-android-arm64-v0.1.1.tar.gz.sha256
          mkdir -p work/jni
          bash bundle/pack-apk-libs.sh \
            --bundle dist/andcode-bundle-android-arm64-v0.1.1.tar.gz \
            --out work/jni
          bash baseline/check-compat.sh --page-align work/jni/arm64-v8a
          test -s work/jni/arm64-v8a/libandcode-ld-linux.so
          test -s work/jni/arm64-v8a/libandcode-libc.so

      - uses: actions/upload-artifact@v4
        with:
          name: andcode-tier-p-native
          path: work/jni/

      - name: Execute physical Tier P Bash (failure blocks downstream APK)
        run: |
          readelf -d work/jni/arm64-v8a/libandcode-ld-linux.so | grep SONAME
          readelf -d work/jni/arm64-v8a/libandcode-libc.so | grep NEEDED
          work/jni/arm64-v8a/libandcode-ld-linux.so \
            --library-path work/jni/arm64-v8a --inhibit-cache \
            work/jni/arm64-v8a/libandcode-bash.so --noprofile --norc -c 'printf "Tier P Bash %s\n" "$BASH_VERSION"'
          HOME="$RUNNER_TEMP" BUN_TMPDIR="$RUNNER_TEMP" GLIBC_TUNABLES=glibc.pthread.rseq=0 \
            work/jni/arm64-v8a/libandcode-ld-linux.so --library-path work/jni/arm64-v8a --inhibit-cache \
            work/jni/arm64-v8a/libandcode-oc2.so --version
          work/jni/arm64-v8a/libandcode-opencode-pty.so --version

      - uses: actions/upload-artifact@v4
        with:
          name: andcode-dist
          path: |
            dist/andcode-bundle-arm64-v0.1.1.tar.gz
            dist/andcode-bundle-arm64-v0.1.1.tar.gz.sha256
            dist/andcode-bundle-android-arm64-v0.1.1.tar.gz
            dist/andcode-bundle-android-arm64-v0.1.1.tar.gz.sha256
            dist/THIRD-PARTY-NOTICES.md
