plugins {
    id("com.android.application")
}

// Only a reviewed CI artifact supplies executable payloads. Never download
// binaries during Gradle configuration or copy ELF into application filesDir.
def nativePayload = providers.gradleProperty("andcodeNativeDir")
if (nativePayload.isPresent()) {
    def payload = file(nativePayload.get())
    if (!new File(payload, "arm64-v8a/libandcode-ld-linux.so").isFile()
            || !new File(payload, "arm64-v8a/libandcode-bash.so").isFile()
            || !new File(payload, "assets/andcode-runtime/manifest.farm").isFile()
            || !new File(payload, "assets/andcode-rootfs/andcode-rootfs-arm64.tgz").isFile()
            || !new File(payload, "assets/andcode-rootfs/andcode-rootfs-arm64.tgz.sha256").isFile()
            || !new File(payload, "assets/andcode-rootfs/packages.txt").isFile()) {
        throw new GradleException("andcodeNativeDir is not a complete Tier P native intermediate artifact")
    }
}

android {
    namespace = "dev.andcode.app"
    compileSdk = 37

    // Fail-closed release signing: all four properties together or none.
    // The keystore never enters the repository; CI injects it from secrets.
    def releaseSigning = [
        providers.gradleProperty("andcodeReleaseStoreFile"),
        providers.gradleProperty("andcodeReleaseStorePassword"),
        providers.gradleProperty("andcodeReleaseKeyAlias"),
        providers.gradleProperty("andcodeReleaseKeyPassword"),
    ]
    def signingCount = releaseSigning.count { it.isPresent() }
    if (signingCount != 0 && signingCount != 4) {
        throw new GradleException("andcodeRelease* signing properties must be provided together")
    }

    defaultConfig {
        applicationId = "dev.andcode.app"
        minSdk = 31
        targetSdk = 37
        versionCode = 1
        versionName = "0.1.1"
        ndk { abiFilters "arm64-v8a" }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging {
        // Explicit-path exec needs files in nativeLibraryDir, not only ZIP mmap.
        jniLibs.useLegacyPackaging = true
        jniLibs.keepDebugSymbols += ["**/libandcode-*.so"]
    }
    androidResources {
        // The embedded canonical rootfs archive is already gzip-compressed;
        // store it verbatim instead of deflating it again in the APK.
        noCompress += "tgz"
    }
    if (nativePayload.isPresent()) {
        sourceSets.main.jniLibs.srcDir(file(nativePayload.get()))
        sourceSets.main.assets.srcDir(new File(file(nativePayload.get()), "assets"))
    }
    if (signingCount == 4) {
        def store = file(releaseSigning[0].get())
        if (!store.isFile()) {
            throw new GradleException("andcodeReleaseStoreFile does not exist: " + store)
        }
        signingConfigs {
            release {
                storeFile = store
                storePassword = releaseSigning[1].get()
                keyAlias = releaseSigning[2].get()
                keyPassword = releaseSigning[3].get()
            }
        }
    }
    buildTypes {
        release {
            // Without signing properties assembleRelease stays unsigned and is
            // not a distribution candidate; never replace the installed
            // debug-signed APK with a different signing identity.
            if (signingCount == 4) {
                signingConfig = signingConfigs.release
                minifyEnabled = false
            }
        }
    }
}

dependencies {
    implementation(project(":terminal-view"))
    implementation(project(":terminal-emulator"))
    implementation("androidx.appcompat:appcompat:1.7.1")
    implementation("com.google.android.material:material:1.13.0")
}
