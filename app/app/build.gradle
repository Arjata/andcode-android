    if (!new File(payload, "arm64-v8a/libandcode-ld-linux.so").isFile()
            || !new File(payload, "arm64-v8a/libandcode-bash.so").isFile()
            || !new File(payload, "assets/andcode-runtime/manifest.farm").isFile()) {
        throw new GradleException("andcodeNativeDir is not a complete Tier P native intermediate artifact")
    }
}

